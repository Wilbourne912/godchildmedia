<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FirstBorn 912 | Supporters List</title>
    <meta name="description" content="Join the FirstBorn 912 supporters list and hear first when new music and transmissions land.">
    <meta name="theme-color" content="#050409">
    <meta property="og:title" content="FirstBorn 912">
    <meta property="og:description" content="On the run, living out of a suitcase, dropping music before time runs out.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/gcm-character.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="/js/gcm-api.js"></script>
</head>
<body class="gcm-themed">

    <main class="gcm-char-page">
        <div id="gcm-character" data-slug="firstborn" data-name="FirstBorn 912" data-subtitle="" data-tagline="On the run, living out of a suitcase, dropping music before time runs out." data-hero="" data-base="/firstborn912/" data-active="signup"></div>

        <section class="gcm-panel">
            <h2>Join the supporters list</h2>
            <p class="gcm-muted">Hear first when new music and transmissions land. Email only.</p>
            <form id="supporter-form" class="gcm-form" data-list="firstborn" data-success="You're in. Thanks for riding with FirstBorn 912.">
                <label for="supporter-email">Email address
                    <input id="supporter-email" type="email" name="email" required autocomplete="email" inputmode="email" placeholder="you@example.com">
                </label>
                <div class="gcm-honeypot" aria-hidden="true">
                    <label for="supporter-website">Website</label>
                    <input id="supporter-website" type="text" name="website" tabindex="-1" autocomplete="off">
                </div>
                <button id="supporter-submit" type="submit" class="gcm-btn gcm-btn-primary">Join</button>
            </form>
            <p id="supporter-status" class="gcm-status" aria-live="polite"></p>
        </section>

        <div id="gcm-socials" class="gcm-actions" hidden></div>
    </main>

    <footer class="gcm-footer">
        <p>A <a href="/" data-track="gcm-home" style="color: #f0b429; text-decoration: none;">God Child Media</a> project</p>
    </footer>

    <script src="/js/gcm-character.js" defer></script>
    <script src="/js/gcm-signup.js" defer></script>
</body>
</html>
