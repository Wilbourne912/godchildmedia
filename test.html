<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCM Smoke Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/js/gcm-api.js"></script>
</head>
<body style="font-family:monospace;background:#050409;color:#eee;padding:16px">
<input id="e" type="email" placeholder="admin email" style="width:100%;margin:4px 0;padding:10px;box-sizing:border-box">
<input id="p" type="password" placeholder="admin password" style="width:100%;margin:4px 0;padding:10px;box-sizing:border-box">
<button id="go" style="padding:12px 20px;margin:8px 0;background:#f0b429;border:0;font-weight:bold">Run tests</button>
<pre id="out" style="white-space:pre-wrap"></pre>
<script>
const out = document.getElementById('out');
const log = (m) => { out.textContent += m + '\n'; };

async function step(name, fn, expectFail) {
  try {
    const r = await fn();
    const text = typeof r === 'string' ? r : JSON.stringify(r);
    log((expectFail ? 'FAIL ' : 'PASS ') + name + ': ' + text);
  } catch (err) {
    log((expectFail ? 'PASS ' : 'FAIL ') + name + ': ' + (err.message || err));
  }
}

document.getElementById('go').onclick = async () => {
  out.textContent = '';
  const mail = 'smoketest@example.com';
  const zero = '00000000-0000-0000-0000-000000000000';

  await step('posts readable', () => GCM.posts.list().then((r) => r.length + ' rows'));
  await step('waitlist join', () => GCM.waitlist.join(mail));
  await step('waitlist duplicate', () => GCM.waitlist.join(mail));
  await step('anon cannot read comments table', async () => {
    const { data, error } = await GCM.db.from('comments').select('*');
    if (error) throw error;
    if (data.length) throw new Error('rows leaked');
    return 'empty';
  });
  await step('anon cannot delete through view', async () => {
    const { error } = await GCM.db.from('comments_public').delete().eq('id', zero);
    if (error) throw error;
    return 'delete was allowed';
  }, true);
  await step('anon cannot create post', () => GCM.admin.createPost({ title: 'Blocked', summary: 's', tag: 't' }), true);
  await step('anon cannot list users', async () => {
    const { data, error } = await GCM.db.from('users').select('*');
    if (error) throw error;
    if (data.length) throw new Error('rows leaked');
    return 'empty';
  });

  await step('admin sign in', () => GCM.auth.signIn(document.getElementById('e').value, document.getElementById('p').value).then(() => 'signed in'));
  await step('isAdmin is true', async () => {
    if (!(await GCM.auth.isAdmin())) throw new Error('not admin');
    return true;
  });
  await step('admin create and delete post', async () => {
    const p = await GCM.admin.createPost({ title: 'Smoke Test', summary: 's', tag: 't' });
    await GCM.admin.deletePost(p.id);
    return 'created and deleted';
  });
  await step('admin cleanup waitlist row', async () => {
    const rows = await GCM.admin.listUsers();
    const t = rows.find((u) => u.email === mail);
    if (!t) throw new Error('test row not found');
    await GCM.admin.deleteUser(t.id);
    return 'deleted';
  });

  await GCM.auth.signOut();
  log('DONE');
};
</script>
</body>
</html>
